name: Spring Boot CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: ./mvnw clean verify

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/github-actions-demo:${{ github.sha }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/github-actions-demo:${{ github.sha }}

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Login to Docker Hub
        run: |
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Pull Docker Image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/github-actions-demo:${{ github.sha }}

      - name: Stop old container
        run: |
          docker stop github-actions-demo 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No old container is running."
          }

      - name: Remove old container
        run: |
          docker rm github-actions-demo 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No old container exists."
          }

      - name: Run new container
        run: |
          docker run -d `
            --name github-actions-demo `
            -p 1212:1212 `
            ${{ secrets.DOCKERHUB_USERNAME }}/github-actions-demo:${{ github.sha }}

      - name: Verify deployment
        run: |
          Start-Sleep -Seconds 10
          docker ps
          $response = Invoke-WebRequest -Uri "http://localhost:1212/api/hello" -UseBasicParsing
          Write-Host "Application response: $($response.Content)"